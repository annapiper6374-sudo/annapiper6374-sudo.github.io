<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>海鸥速递 · 合伙人物流看板</title>
  <meta name="description" content="头程轨迹、到货情况、到货时间。散货卡派以预计时间为准。" />
  <style>
    body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f6f1e8;color:#14242b}
    .wrap{width:min(1100px,calc(100% - 24px));margin:0 auto;padding:16px 0 48px}
    header{background:#0f3d3b;color:#fff;padding:16px 0}
    header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .mark{width:36px;height:36px;border-radius:10px;background:#1b7a74;display:grid;place-items:center;font-weight:700}
    .brand{display:flex;gap:10px;align-items:center}
    .brand small{opacity:.75;font-size:12px}
    h1{margin:18px 0 6px;font-size:26px}
    .lead{color:#5b6b72;line-height:1.6;margin:0 0 16px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
    .stat{background:#fffdf8;border:1px solid #e4ddd1;border-radius:14px;padding:12px}
    .stat b{display:block;font-size:24px}
    .stat span{color:#5b6b72;font-size:12px}
    .search{width:100%;border:1px solid #e4ddd1;border-radius:999px;padding:10px 14px;margin-bottom:14px;font:inherit}
    .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .col{background:rgba(255,255,255,.5);border:1px solid #e4ddd1;border-radius:18px;padding:10px}
    .col h2{margin:4px 6px 10px;font-size:16px}
    .card{background:#fffdf8;border:1px solid #e4ddd1;border-radius:16px;padding:12px;margin-bottom:8px}
    .tag{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:#eef6f5;margin:0 4px 6px 0}
    .eta{margin-top:8px;background:#fff8ee;border:1px solid #efd7ad;border-radius:10px;padding:8px;color:#8a4b08}
    .track{color:#5b6b72;font-size:13px;line-height:1.55;margin-top:6px}
    .hint{margin-top:16px;background:#fff7ea;border:1px solid #efd7ad;border-radius:12px;padding:12px;color:#6b4a16;line-height:1.6}
    @media(max-width:800px){.stats,.board{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand"><div class="mark">鸥</div><div><b>海鸥速递</b><br><small>合伙人观看 · 只读</small></div></div>
      <small>打开即可看最新进度</small>
    </div>
  </header>
  <main class="wrap">
    <h1>物流轨迹 · 到货情况 · 到货时间</h1>
    <p class="lead">散货只有卡派，没有快递单号。请看预计到港和预计到货时间。页面打开即为当前最新数据。</p>
    <div class="stats" id="stats"></div>
    <input class="search" id="q" placeholder="搜批次、产品、目的仓" />
    <div class="board" id="board"></div>
    <div class="hint">口径：海运散货 = 卡派。卡派不提供 UPS/FedEx 轨迹，以预计到货时间为准。到仓后显示实际到货日期。</div>
  </main>
  <script>
    const DATA = [
      {id:"AIR-20260814-FL",type:"空运快递",product:"单株白云虎皮兰",qty:618,origin:"广州·基地物流",dest:"绿植新仓·佛罗里达",lastMile:"UPS",etaPort:"2026-08-22",etaSign:"2026-08-24",actualSign:"",stage:"头程",node:"已入仓",tracks:["2026-08-14 已入仓","UPS 1Z12CE790302627365"]},
      {id:"AIR-20260814-FL-2",type:"空运快递",product:"110#无纺布套袋、160#无纺布套袋、110#透明套袋",qty:17500,origin:"深圳·HO",dest:"绿植新仓·佛罗里达",lastMile:"UPS",etaPort:"2026-08-16",etaSign:"2026-08-17",actualSign:"",stage:"头程",node:"头程运输",tracks:["2026-08-14 头程运输","UPS 1ZB870X66622219475"]},
      {id:"SEA-FCL-20260801-ED",type:"海运整柜",product:"纸箱",qty:9920,origin:"广州·美绮",dest:"绿植美东仓·34744",lastMile:"卡派",etaPort:"2026-09-14",etaSign:"2026-09-20",actualSign:"",stage:"运输途中",node:"海运在途",tracks:["2026-08-01 海运在途"]},
      {id:"SEA-LCL-20260613-WX",type:"海运散货",product:"太阳花种子",qty:10000,origin:"深圳·玩头程",dest:"绿植美西仓·91710",lastMile:"FedEx",etaPort:"2026-06-28",etaSign:"",actualSign:"",stage:"运输途中",node:"清关中",tracks:["2026-06-13 清关中","FedEx 873037051988","查验，赔付中"]},
      {id:"SEA-LCL-20260723-ED",type:"海运散货",product:"电动搬运车",qty:1,origin:"东莞·ZST",dest:"绿植美东仓·34744",lastMile:"卡派",etaPort:"2026-08-10",etaSign:"",actualSign:"",stage:"运输途中",node:"海运在途",tracks:["2026-07-23 海运在途"]},
      {id:"SEA-LCL-20260730-ED",type:"海运散货",product:"电风扇",qty:20,origin:"东莞·ZST",dest:"绿植美东仓·34744",lastMile:"卡派",etaPort:"2026-08-10",etaSign:"",actualSign:"",stage:"运输途中",node:"海运在途",tracks:["2026-07-30 海运在途"]},
      {id:"AIR-20260628-ED",type:"空运快递",product:"100套110#土培花盆、70棵洒金龟背竹",qty:170,origin:"深圳·玩头程",dest:"绿植美东仓·34744",lastMile:"UPS",etaPort:"2026-07-09",etaSign:"2026-07-13",actualSign:"",stage:"已签收",node:"客户已签收",tracks:["2026-06-28 客户已签收","UPS 1Z12CE790332558866"]},
      {id:"AIR-20260628-ED-2",type:"空运快递",product:"60个透明外盆、45虎皮兰",qty:105,origin:"深圳·玩头程",dest:"绿植美东仓·34744",lastMile:"UPS",etaPort:"2026-07-09",etaSign:"2026-07-13",actualSign:"",stage:"已签收",node:"客户已签收",tracks:["2026-06-28 客户已签收","UPS 1Z12CE790327953877"]},
      {id:"AIR-20260628-ED-3",type:"空运快递",product:"35白玉虎皮兰、60套110#土培花盆、60套110#水培花盆",qty:155,origin:"深圳·玩头程",dest:"绿植美东仓·34744",lastMile:"UPS",etaPort:"2026-07-09",etaSign:"2026-07-13",actualSign:"",stage:"已签收",node:"客户已签收",tracks:["2026-06-28 客户已签收","UPS 1Z12CE790337568480"]},
      {id:"AIR-20260628-ED-4",type:"空运快递",product:"50虎皮兰",qty:50,origin:"深圳·玩头程",dest:"绿植美东仓·34744",lastMile:"UPS",etaPort:"2026-07-09",etaSign:"2026-07-13",actualSign:"",stage:"已签收",node:"客户已签收",tracks:["2026-06-28 客户已签收","UPS 1Z12CE790331818694"]},
      {id:"AIR-20260628-WX",type:"空运快递",product:"60套110#土培花盆、70棵洒金龟背竹、35白玉虎皮兰、60套110#水培花盆、虎皮兰",qty:385,origin:"深圳·玩头程",dest:"绿植美西仓·91710",lastMile:"UPS",etaPort:"2026-07-12",etaSign:"2026-07-14",actualSign:"",stage:"已签收",node:"客户已签收",tracks:["2026-06-28 客户已签收","UPS 1Z12CE790336480503"]},
      {id:"AIR-20260723-ED",type:"空运快递",product:"植物养护手册、发财树套网",qty:6100,origin:"深圳·HO",dest:"绿植美东仓·34744",lastMile:"UPS",etaPort:"2026-07-25",etaSign:"2026-07-27",actualSign:"",stage:"已签收",node:"客户已签收",tracks:["2026-07-23 客户已签收","UPS 1ZB870X66623322039"]}
    ];
    function arrival(s){
      if(s.stage==="已签收"||s.actualSign) return "已到货，已签收";
      if(/卡派/.test(s.node||"")) return "已到港，卡派途中";
      if(/清关/.test(s.node||"")) return "清关中 / 查验";
      if(/到港/.test(s.node||"")) return "已到港，待卡派";
      if(s.stage==="运输途中") return "在途未到";
      return "头程准备中";
    }
    function render(){
      const q=(document.getElementById("q").value||"").trim();
      const list=DATA.filter(s=>!q||[s.id,s.product,s.dest,s.origin].join(" ").indexOf(q)>=0);
      const n=st=>list.filter(s=>s.stage===st).length;
      document.getElementById("stats").innerHTML=
        "<div class='stat'><b>"+n("头程")+"</b><span>头程</span></div>"+
        "<div class='stat'><b>"+n("运输途中")+"</b><span>运输途中</span></div>"+
        "<div class='stat'><b>"+n("已签收")+"</b><span>已签收</span></div>"+
        "<div class='stat'><b>"+list.filter(s=>s.type==="海运散货").length+"</b><span>散货卡派</span></div>";
      document.getElementById("board").innerHTML=["头程","运输途中","已签收"].map(st=>{
        const items=list.filter(s=>s.stage===st);
        return "<section class='col'><h2>"+st+" · "+items.length+"</h2>"+(items.map(s=>
          "<article class='card'><span class='tag'>"+s.type+"</span><span class='tag'>"+s.lastMile+"</span>"+
          "<div style='font-weight:700;margin:4px 0'>"+s.product+" · "+s.qty+"件</div>"+
          "<div class='track'>"+s.id+"<br>"+s.origin+" → "+s.dest+"</div>"+
          "<div class='eta'>到货情况："+arrival(s)+"<br>预计到港："+(s.etaPort||"待定")+"<br><b>预计到货："+(s.etaSign||"待定")+"</b>"+
          (s.actualSign?"<br>实际到货："+s.actualSign:"")+"</div>"+
          "<div class='track'>轨迹：<br>"+(s.tracks||[]).join("<br>")+"</div></article>"
        ).join("")||"<div class='track'>暂无</div>")+"</section>";
      }).join("");
    }
    document.getElementById("q").oninput=render;
    render();
  </script>
</body>
</html>
